<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>관극 다이어리</title>

<style>
/* --- 설정된 테마 (기존 디자인 유지) --- */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap');

:root {
  --bg:#071120; --bg2:#0d1b33; --bg3:#152745; --bg4:#1e3559;
  --brd:#2a4066; --brd2:#3c5685;
  --txt:#ffffff; --txt2:#e0e7f1; --txt3:#aab7cc; --txt4:#7b8ba6; --dim:#576885;
  --red:#00e5ff; --red2:#00b8cc; --red3:#66eeff; --red4:#00e5ff;
  --grn:#ffcc00; --grn2:#ffdb4d;
  --blu:#5c8aff; --blu2:#8fb1ff;
  --ylw:#e2e8f0; --ylw2:#ffffff;
  --seat1:#1a3570; --seat2:#1e52a0; --seat3:#2e70cc; --seat4:#4490e0; --seat5:#6ab0ff;
  --tab-h: 60px;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--txt); font-family:'Pretendard', sans-serif; font-size:14px; overflow-x:hidden; }
#app { padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }

/* TAB BAR */
.tab-bar {
  position:fixed; bottom:0; left:0; width:100%;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
  background:var(--bg2); border-top:1px solid var(--brd);
  display:flex; z-index:100;
}
.tab-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background:none; border:none; cursor:pointer; color:var(--txt4); font-size:10px; transition:color 0.2s;
}
.tab-btn.active { color:var(--red); }
.tab-btn .icon { font-size:20px; }

/* PAGES & COMMON */
.page { display:none; padding:16px; animation: fadeIn 0.2s ease; }
.page.active { display:block; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.page-title { font-family:'IBM Plex Sans KR', sans-serif; font-size:22px; font-weight:700; color:var(--txt); margin-bottom:16px; text-shadow:0 0 12px rgba(0,229,255,.3); }
.card { background:var(--bg2); border:1px solid var(--brd); border-radius:12px; padding:16px; margin-bottom:16px; }
.card-title { font-size:13px; color:var(--txt2); margin-bottom:12px; font-weight:600; letter-spacing:0.05em; }

/* BUTTONS */
.btn { background:transparent; border:1px solid var(--brd2); color:var(--txt2); padding:8px 14px; cursor:pointer; font-family:inherit; font-size:13px; border-radius:6px; transition:all 0.2s; }
.btn:active { border-color:var(--red3); color:var(--red3); }
.btn.prim { background:var(--red); border-color:var(--red); color:#000; font-weight:700; }
.btn.prim:active { background:var(--red2); border-color:var(--red2); }
.btn.sm { padding:4px 10px; font-size:11px; }
.btn.ghost { background:transparent; border-color:transparent; color:var(--txt4); }
.btn.grn { background:var(--grn); border-color:var(--grn); color:#000; font-weight:700; }
.flex-between { display:flex; justify-content:space-between; align-items:center; }

/* TABLE (관극 기록) - 가로 스크롤 및 Sticky 틀 고정 */
.twrap { overflow-x:auto; margin:0 -16px; padding:0 16px; -webkit-overflow-scrolling: touch; }
table.record-tb { width:max-content; min-width:100%; border-collapse:separate; border-spacing:0; border:1px solid var(--brd); border-left:0; border-top:0; }
.record-tb th, .record-tb td { padding:8px 6px; border-bottom:1px solid var(--brd); border-right:1px solid var(--brd); text-align:center; white-space:nowrap; font-size:12px; }
.record-tb thead th { border-top:1px solid var(--brd); background:var(--bg4); position:sticky; top:0; z-index:21; font-size:10px; color:var(--txt3); }

/* 고정(Sticky) 열 설정 (1:날짜, 2:시간, 3:캐스트) */
.st-date { position:sticky; left:0; z-index:20; background:var(--bg2); border-left:1px solid var(--brd); min-width:55px; max-width:55px; }
.st-time { position:sticky; left:55px; z-index:20; background:var(--bg2); min-width:45px; max-width:45px; }
.st-cast { position:sticky; left:100px; z-index:20; background:var(--bg2); min-width:85px; max-width:85px; border-right:2px solid var(--red) !important; overflow:hidden; text-overflow:ellipsis; }
.record-tb thead .st-date, .record-tb thead .st-time, .record-tb thead .st-cast { background:var(--bg4); z-index:22; }

/* FORMS & MODALS */
.finput, .fselect { width:100%; background:var(--bg3); border:1px solid var(--brd2); color:var(--txt); padding:10px 12px; font-family:inherit; font-size:13px; border-radius:6px; outline:none; color-scheme:dark; }
.finput:focus, .fselect:focus { border-color:var(--red); }
.fg { margin-bottom:12px; }
.flbl { display:block; font-size:11px; color:var(--txt3); margin-bottom:5px; }
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:200; justify-content:center; align-items:flex-end; }
.overlay.show { display:flex; }
.modal { background:var(--bg2); border-top:2px solid var(--red); width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:20px; border-radius:16px 16px 0 0; animation:slideUp 0.3s ease; }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

/* CALENDAR & EVENTS */
.cal-filter-group { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.cal-filter-label { font-size:12px; color:var(--txt3); width:50px; font-weight:600; }
.cal-filter-btn { background:var(--bg3); border:1px solid var(--brd2); color:var(--txt4); padding:4px 10px; border-radius:4px; font-size:12px; cursor:pointer; transition:all 0.2s; }
.cal-filter-btn.active { background:var(--bg4); border-color:var(--txt2); color:var(--txt); font-weight:600; }

.cal-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:1px; position:relative; background:var(--brd); border:1px solid var(--brd); border-radius:4px; overflow:hidden;}
.cal-dow { text-align:center; font-size:11px; font-weight:700; color:var(--txt3); padding:8px 0; background:var(--bg2); }
.cal-day { min-height:100px; background:var(--bg); padding:6px 4px; cursor:pointer; position:relative; display:flex; flex-direction:column; align-items:flex-start; transition:background 0.15s; }
.cal-day.today { background:rgba(255,204,0,.05); border:1px solid var(--grn); }
.cal-day.empty { background:var(--bg2); cursor:default; }

/* 날짜 왼쪽 정렬 및 색상 */
.cal-day-num { font-size:12px; font-weight:700; color:var(--txt3); margin-bottom:4px; padding-left:2px; }
.cal-day.sun .cal-day-num { color:#ff6b6b; }
.cal-day.sat .cal-day-num { color:#5c8aff; }

/* 회차 블록 (줄바꿈 표시) */
.cs-chip { width:100%; text-align:left; padding:4px; border-radius:4px; margin-top:4px; background:transparent; border:1px solid transparent; }
.cs-time { font-size:11px; font-weight:700; color:var(--txt); }
.cs-time::before { content: '• '; }
.cs-cast { font-size:10px; color:var(--txt3); margin-top:2px; padding-left:8px; word-break:keep-all; }
.cs-chip.booked { background:rgba(0, 229, 255, 0.1); border-color:var(--red); }
.cs-chip.booked .cs-time, .cs-chip.booked .cs-cast { color:var(--red); }

/* WALLET & STAMPS */
.wallet-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:16px; }
.wcard { background:var(--bg3); border:1px solid var(--brd2); border-radius:8px; text-align:center; padding:10px 4px; }
.wcard-num { font-size:20px; font-weight:700; color:var(--grn); font-family:'IBM Plex Sans KR'; margin:4px 0; }
.collapsible-content { display:none; margin-top:12px; border-top:1px dashed var(--brd2); padding-top:12px; }
.collapsible-content.open { display:block; }

/* HEATMAP */
.heatmap-wrap { display:flex; gap:10px; justify-content:center; overflow-x:auto; padding-bottom:10px; }
.zone-col { display:flex; flex-direction:column; gap:2px; align-items:center; }
.seat-row { display:flex; gap:2px; align-items:center; }
.row-label { font-size:8px; width:16px; text-align:right; color:var(--txt4); margin-right:2px; white-space:nowrap; }
.seat-cell { width:12px; height:12px; background:var(--bg4); border-radius:2px; border:1px solid transparent; flex-shrink:0; }
.seat-cell.v1 { background:var(--seat1); border-color:var(--seat1); } 
.seat-cell.v2 { background:var(--seat2); border-color:var(--seat2); }
.seat-cell.v3 { background:var(--seat3); border-color:var(--seat3); } 
.seat-cell.v4 { background:var(--seat4); border-color:var(--seat4); }
.seat-cell.v5 { background:var(--seat5); border-color:var(--seat5); }
.heatmap-legend { display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--txt2); }
.legend-dot { width:12px; height:12px; border-radius:2px; }
</style>
</head>
<body>

<div id="app">
  <div class="page active" id="page-record">
    <div class="flex-between" style="margin-bottom:16px;">
      <div class="page-title" id="app-title-display">관극 기록</div>
      <button class="btn prim sm" onclick="openRecordModal()">+ 추가</button>
    </div>
    <div class="twrap">
      <table class="record-tb">
        <thead id="record-thead"></thead>
        <tbody id="record-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="page" id="page-calendar">
    <div class="page-title">스케줄 달력</div>
    
    <div class="card" style="padding:16px 12px;">
      <div id="cal-filter-wrap"></div>
      <div style="margin-top:12px;">
        <button class="btn sm" style="margin-right:4px;" onclick="applyCalFilter()">조회하기</button>
        <button class="btn sm ghost" onclick="resetCalFilter()">초기화</button>
      </div>
    </div>

    <div class="card" style="padding:12px;">
      <div class="cal-nav">
        <button class="btn sm" onclick="changeMonth(-1)">‹ 이전달</button>
        <div id="cal-month-title" style="font-weight:700; font-size:18px;"></div>
        <button class="btn sm" onclick="changeMonth(1)">다음달 ›</button>
      </div>
      <div id="cal-grid-container"></div>
    </div>
  </div>

  <div class="page" id="page-coupon">
    <div class="page-title">할인권 및 도장판</div>
    <div class="card">
      <div class="flex-between" style="margin-bottom:12px;">
        <div class="card-title" style="margin:0;">지갑 현황</div>
        <button class="btn grn sm" onclick="openWalletModal()">+ 추가/차감</button>
      </div>
      <div class="wallet-grid" id="wallet-cards"></div>
      <div class="card-title" style="cursor:pointer; color:var(--txt3);" onclick="toggleCollapsible('wallet-history')">
        ▶ 할인권 상세 기록 (접기/펴기)
      </div>
      <div id="wallet-history" class="collapsible-content">
        <table class="record-tb" style="width:100%; font-size:11px; border-left:1px solid var(--brd);">
          <thead><tr><th>날짜</th><th>유형</th><th>내역</th><th>메모</th><th>관리</th></tr></thead>
          <tbody id="wallet-history-body"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="flex-between" style="margin-bottom:12px;">
        <div class="card-title" style="margin:0;">도장판 현황</div>
        <button class="btn sm" onclick="addBoard()">+ 도장판 추가</button>
      </div>
      <div id="board-status-container"></div>
    </div>
  </div>

  <div class="page" id="page-stats">
    <div class="page-title">정산 통계</div>
    <div class="card">
      <div class="card-title">배우별 관람 횟수</div>
      <table class="record-tb" style="width:100%; border-left:1px solid var(--brd);" id="stats-actors"></table>
    </div>
    <div class="card">
      <div class="card-title">좌석 히트맵</div>
      <div class="heatmap-wrap" id="heatmap-container"></div>
      <div class="heatmap-legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--bg4);"></div>0회</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--seat1);"></div>1회</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--seat2);"></div>2회</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--seat3);"></div>3회</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--seat4);"></div>4회</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--seat5);"></div>5회+</div>
      </div>
    </div>
  </div>

  <div class="page" id="page-settings">
    <div class="page-title">설정</div>
    <div class="card">
      <div class="card-title">데이터 동기화</div>
      <div class="flex-between" style="margin-bottom:12px; border-bottom:1px solid var(--brd2); padding-bottom:8px;">
        <div>
          <div style="font-size:13px;">스케줄 업데이트</div>
          <div id="set-sch-time" style="font-size:10px; color:var(--txt4);">확인 중...</div>
        </div>
        <button class="btn sm" onclick="fetchSchedule(true)">새로고침</button>
      </div>
      <div class="flex-between">
        <div>
          <div style="font-size:13px;">이벤트 업데이트</div>
          <div id="set-evt-time" style="font-size:10px; color:var(--txt4);">확인 중...</div>
        </div>
        <button class="btn sm" onclick="fetchEvents(true)">새로고침</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">백업 및 복원</div>
      <div style="display:flex; gap:10px;">
        <button class="btn" style="flex:1;" onclick="exportData()">JSON 백업</button>
        <button class="btn" style="flex:1;" onclick="document.getElementById('import-file').click()">복원하기</button>
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
      </div>
    </div>
  </div>
</div>

<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('record', this)"><span class="icon">📝</span>기록</button>
  <button class="tab-btn" onclick="switchTab('calendar', this)"><span class="icon">📅</span>달력</button>
  <button class="tab-btn" onclick="switchTab('coupon', this)"><span class="icon">🎫</span>도장·할인</button>
  <button class="tab-btn" onclick="switchTab('stats', this)"><span class="icon">📊</span>정산</button>
  <button class="tab-btn" onclick="switchTab('settings', this)"><span class="icon">⚙️</span>설정</button>
</nav>

<div class="overlay" id="modal-record">
  <div class="modal">
    <div class="page-title" id="rm-title" style="font-size:18px;">회차 기록</div>
    <input type="hidden" id="rm-id">
    
    <div style="display:flex; gap:10px;">
      <div class="fg" style="flex:1;">
        <label class="flbl">날짜</label>
        <input type="date" id="rm-date" class="finput" onchange="autoFillCasting()">
      </div>
      <div class="fg" style="width:80px;">
        <label class="flbl">시간</label>
        <select id="rm-time" class="fselect" onchange="onTimeChange()">
          <option value="낮">낮</option><option value="밤">밤</option>
        </select>
      </div>
    </div>
    <div style="display:flex; gap:10px;" id="rm-cast-container"></div>
    <div class="fg">
      <label class="flbl">할인 권종</label>
      <select id="rm-disc" class="fselect"></select>
    </div>
    <div class="fg">
      <label class="flbl">좌석 정보 (구역 / 열 / 번호)</label>
      <div style="display:flex; gap:10px;">
        <select id="rm-zone" class="fselect" style="flex:1;"><option value="">-</option><option value="A">A</option><option value="B">B</option><option value="C">C</option></select>
        <input type="number" id="rm-row" class="finput" style="flex:1;" placeholder="열" min="0">
        <input type="number" id="rm-num" class="finput" style="flex:1;" placeholder="번호" min="1">
      </div>
    </div>
    <div class="fg">
      <label class="flbl">도장 적립</label>
      <div id="rm-boards" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
      <div style="display:flex; gap:6px; margin-top:8px; align-items:center;">
        <input type="text" id="rm-new-board-name" class="finput" style="flex:1; padding:6px 10px; min-height:34px; font-size:12px;" placeholder="새 도장판 이름 (비우면 자동)">
        <button type="button" class="btn prim sm" style="white-space:nowrap; min-height:34px;" onclick="addBoardFromModal()">+ 추가</button>
      </div>
    </div>
    <div class="fg">
      <label class="flbl">메모</label>
      <input type="text" id="rm-memo" class="finput" placeholder="메모를 입력하세요">
    </div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn" style="flex:1;" onclick="closeModal('modal-record')">취소</button>
      <button class="btn prim" style="flex:1;" onclick="saveRecord()">저장</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-wallet">
  <div class="modal">
    <div class="page-title" id="wm-title" style="font-size:18px;">할인권 내역</div>
    <input type="hidden" id="wm-id">
    <div class="fg"><label class="flbl">날짜</label><input type="date" id="wm-date" class="finput"></div>
    <div class="fg">
      <label class="flbl">유형</label>
      <select id="wm-type" class="fselect"><option value="add">획득(+)</option><option value="sub">사용/차감(-)</option></select>
    </div>
    <div id="wm-coupon-inputs" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;"></div>
    <div class="fg"><label class="flbl">메모</label><input type="text" id="wm-memo" class="finput"></div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn" style="flex:1;" onclick="closeModal('modal-wallet')">취소</button>
      <button class="btn grn" style="flex:1;" onclick="saveWallet()">저장</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 1. EXTENSIBILITY CONFIGURATION 
// ============================================================
const CONFIG = {
  SHOW_NAME: "라져",
  STORAGE_KEY: "musical_tracker_v3",
  
  ROLES: [
    { id: "cast1", label: "스카일러", actors: ["주민진", "고상호", "기세중"] },
    { id: "cast2", label: "디디", actors: ["정휘", "이한솔", "박주혁"] }
  ],
  
  EVENTS: [
    { name:'스페셜커튼콜', startDate:'2026-03-31', endDate:'2026-04-05', color:'#8B5CF6' },
    { name:'트리플적립',   startDate:'2026-04-07', endDate:'2026-04-12', color:'#F59E0B' }
  ],
  
  DISCOUNTS: [
    { label: "없음", value: "" },
    { label: "프리뷰", value: "프리뷰" },
    { label: "조예할", value: "조예할" },
    { label: "마티네할", value: "마티네할" },
    { label: "창작산실할", value: "창작산실할", useWallet: "arko" },
    { label: "재관할", value: "재관할", useWallet: "re" },
    { label: "40% 할인권", value: "40%", useWallet: "d40" },
    { label: "50% 할인권", value: "50%", useWallet: "d50" },
    { label: "증빙 프리패스", value: "증빙", useWallet: "cert" },
    { label: "타임세일", value: "타임세일" },
    { label: "교환", value: "교환" }
  ],
  
  WALLET_FIELDS: [
    { id: "re", label: "재관람 할인표" },
    { id: "arko", label: "창작산실표" },
    { id: "d40", label: "40% 할인권" },
    { id: "d50", label: "50% 할인권" },
    { id: "cert", label: "증빙 프리패스" }
  ],

  STAMP_MILESTONES: [3, 7]
};

// ============================================================
// 2. STATE MANAGEMENT
// ============================================================
let state = {
  records: [], 
  boards: [{ id: "b1", name: "1", initial: 0, active: true }],

function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function autoFillCasting() {
  const date = document.getElementById('rm-date').value;
  const timeSelect = document.getElementById('rm-time');
  if (!date || !state.schedule) return;
  
  const matches = state.schedule.filter(s => s.date === date);
  if (matches.length > 0) {
    const cur = timeSelect.value;
    timeSelect.innerHTML = '<option value="">선택</option>';
    matches.sort((a,b)=>a.time.localeCompare(b.time)).forEach(s => {
      const o = document.createElement('option');
      o.value = s.time; o.textContent = s.time;
      timeSelect.appendChild(o);
    });
    
    const setCasts = (m) => {
      document.getElementById('rm-cast1').value = m.cast1 || m.skylar || '';
      document.getElementById('rm-cast2').value = m.cast2 || m.didi || '';
    };

    if (matches.length === 1) {
      timeSelect.value = matches[0].time;
      setCasts(matches[0]);
    } else if (cur) {
      timeSelect.value = cur;
      const m = matches.find(s => s.time === cur);
      if (m) setCasts(m);
    }
  } else {
    timeSelect.innerHTML = `<option value="낮">낮</option><option value="밤">밤</option>`;
  }
}

function onTimeChange() {
  const date = document.getElementById('rm-date').value;
  const time = document.getElementById('rm-time').value;
  if (!date || !time || !state.schedule) return;
  const m = state.schedule.find(s => s.date === date && s.time === time);
  if (m) {
    document.getElementById('rm-cast1').value = m.cast1 || m.skylar || '';
    document.getElementById('rm-cast2').value = m.cast2 || m.didi || '';
  }
}

// 필터 UI 렌더링
function renderCalFilters() {
  let html = '';
  CONFIG.ROLES.forEach((role, idx) => {
    const roleKey = `cast${idx+1}`;
    html += `<div class="cal-filter-group">
      <div class="cal-filter-label">${role.label}</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">`;
    role.actors.forEach(actor => {

function toggleCalFilter(roleKey, actor) {
  const idx = calFilters[roleKey].indexOf(actor);
  if (idx > -1) calFilters[roleKey].splice(idx, 1);
  else calFilters[roleKey].push(actor);
  renderCalFilters(); // 버튼 색깔 업데이트
}

function applyCalFilter() {
  renderCalendar();
}

function resetCalFilter() {
  calFilters = { cast1: [], cast2: [] };
  renderCalFilters();
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('cal-month-title').textContent = `${curYear}년 ${curMonth+1}월`;
  
  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const totalCells = firstDay + daysInMonth;
  const weeks = Math.ceil(totalCells / 7);
  const monthStr = `${curYear}-${String(curMonth+1).padStart(2,'0')}`;
  const monthStart = `${monthStr}-01`;
  const monthEnd = `${monthStr}-${String(daysInMonth).padStart(2,'0')}`;

  const evts = state.events && state.events.length ? state.events : [];
  const segments = [];
  evts.forEach(ev => {
    if (ev.endDate < monthStart || ev.startDate > monthEnd) return;
    const clampedStart = ev.startDate < monthStart ? monthStart : ev.startDate;
    const clampedEnd   = ev.endDate   > monthEnd   ? monthEnd   : ev.endDate;
    const startCell = firstDay + parseInt(clampedStart.slice(8)) - 1;
    const endCell   = firstDay + parseInt(clampedEnd.slice(8))   - 1;
    
    for (let w = Math.floor(startCell/7); w <= Math.floor(endCell/7); w++) {
      const sc = Math.max(startCell, w*7) % 7;
      const ec = Math.min(endCell,   w*7+6) % 7;
      const used = segments.filter(s => s.week === w);
      let row = 0;
      while (row < 3) {
        const conflict = used.filter(s => s.row === row).some(s => !(ec < s.startCol || sc > s.endCol));
        if (!conflict) break;
        row++;
      }
      if (row < 3) segments.push({ week: w, startCol: sc, endCol: ec, color: ev.color, name: ev.name, row });
    }
  });

  const dow = ['일','월','화','수','목','금','토'];
  let html = `<div class="cal-grid">`;
  dow.forEach(d => html += `<div class="cal-dow">${d}</div>`);
  html += `</div>`; 
  
  for(let w=0; w<weeks; w++) {
    const wSegs = segments.filter(s => s.week === w);
    const maxRow = wSegs.length ? Math.max(...wSegs.map(s => s.row)) + 1 : 0;
    const evHeight = maxRow * 16; 

    html += `<div class="cal-grid" style="margin-top:-1px;">`;
    for(let col=0; col<7; col++) {
      const cell = w * 7 + col;
      const day = cell - firstDay + 1;
      
      if(cell < firstDay || day > daysInMonth) {
        html += `<div class="cal-day empty"></div>`;
        continue;
      }
      
      const dateStr = `${monthStr}-${String(day).padStart(2,'0')}`;
      const isToday = dateStr === todayStr();
      const isSun = new Date(curYear, curMonth, day).getDay() === 0;
      const isSat = new Date(curYear, curMonth, day).getDay() === 6;
      
      let dayItems = [];
      (state.schedule || []).filter(s => s.date === dateStr).forEach(s => {
        dayItems.push({ time: s.time, cast1: s.cast1 || s.skylar, cast2: s.cast2 || s.didi, isBooked: false });
      });
      state.records.filter(r => r.date === dateStr).forEach(r => {
        let existing = dayItems.find(i => i.time === r.time);
        if (existing) { existing.isBooked = true; existing.cast1 = r.cast1; existing.cast2 = r.cast2; } 
        else { dayItems.push({ time: r.time, cast1: r.cast1, cast2: r.cast2, isBooked: true }); }
      });

      // 캐스트 필터 적용 (선택된 캐스트가 비어있으면 통과, 있으면 포함되어야 통과)
      dayItems = dayItems.filter(i => {
        const c1Match = calFilters.cast1.length === 0 || calFilters.cast1.includes(i.cast1);
        const c2Match = calFilters.cast2.length === 0 || calFilters.cast2.includes(i.cast2);
        return c1Match && c2Match;
      });

      dayItems.sort((a,b) => a.time.localeCompare(b.time));

      // 칩 그리기: 시간 \n 풀네임
      let chipsHtml = dayItems.map(i => {
        const cls = i.isBooked ? 'booked' : '';
        return `<div class="cs-chip ${cls}">
          <div class="cs-time">${i.time}</div>
          <div class="cs-cast">${i.cast1 || '-'}, ${i.cast2 || '-'}</div>
        </div>`;
      }).join('');

      html += `<div class="cal-day ${isToday ? 'today' : ''} ${isSun ? 'sun' : ''} ${isSat ? 'sat' : ''}" onclick="openRecordModal('${dateStr}')">
        <span class="cal-day-num">${day}</span>
        <div style="height:${evHeight}px; flex-shrink:0; width:100%;"></div>
        ${chipsHtml}
      </div>`;
    }

    if (maxRow > 0) {
      html += `<div style="position:absolute; top:24px; left:0; right:0; pointer-events:none;">`;
      for (let row = 0; row < maxRow; row++) {
        html += `<div style="position:relative; height:15px; margin-bottom:1px;">`;
        wSegs.filter(s => s.row === row).forEach(s => {
          const leftPct  = (s.startCol / 7 * 100).toFixed(2);
          const widthPct = ((s.endCol - s.startCol + 1) / 7 * 100).toFixed(2);
          html += `<div style="position:absolute; left:${leftPct}%; width:calc(${widthPct}% - 2px); height:14px; background:${s.color}; border-radius:2px; display:flex; align-items:center; padding:0 4px; overflow:hidden;">
            <span style="font-size:9px; font-weight:700; color:#fff; white-space:nowrap;">${s.name}</span>
          </div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  document.getElementById('cal-grid-container').innerHTML = html;
}

function calculateWalletBalance() {
  let balances = {};
  CONFIG.WALLET_FIELDS.forEach(f => balances[f.id] = 0);
  state.wallet.forEach(w => {
    CONFIG.WALLET_FIELDS.forEach(f => {
      if(w.items[f.id]) balances[f.id] += (w.type === 'add' ? w.items[f.id] : -w.items[f.id]);
    });
  });
  state.records.forEach(r => {
    const discDef = CONFIG.DISCOUNTS.find(d => d.value === r.discount);
    if(discDef && discDef.useWallet) balances[discDef.useWallet] -= 1;
  });
  return balances;
}

function renderCoupons() {
  const bals = calculateWalletBalance();
  document.getElementById('wallet-cards').innerHTML = CONFIG.WALLET_FIELDS.map(f => `
    <div class="wcard">

      <div class="wcard-num" style="color:${bals[f.id] < 0 ? 'var(--red3)' : 'var(--grn)'}">${bals[f.id]}</div>
    </div>
  `).join('');

  const histTbody = document.getElementById('wallet-history-body');

    histTbody.innerHTML = `<tr><td colspan="5" style="padding:20px; color:var(--txt4);">기록이 없습니다</td></tr>`;
  } else {

  });

  document.getElementById('board-status-container').innerHTML = state.boards.map(b => {
    const cnt = boardCounts[b.id];
    const nxt = CONFIG.STAMP_MILESTONES.find(m => m > cnt);
    const pct = Math.min(100, Math.round(cnt/7*100));
    
    return `<div style="background:var(--bg3); border:1px solid var(--brd2); padding:12px; border-radius:8px; margin-bottom:8px;">
      <div class="flex-between" style="margin-bottom:8px;">
        <span style="font-weight:600; font-size:13px;">[도장판] ${b.name}</span>
        <span style="font-size:18px; font-family:'IBM Plex Sans KR'; color:var(--red); font-weight:700;">${cnt} <span style="font-size:12px; color:var(--txt3);">개</span></span>
      </div>
      <div style="font-size:10px; color:var(--txt3); margin-bottom:6px;">
        ${nxt ? `다음 보상(${nxt}개)까지 ${nxt - cnt}개 남음` : `<span style="color:var(--grn);">✓ 최종 보상 달성 완료</span>`}
      </div>
      <div style="height:4px; background:var(--bg4); border-radius:2px; overflow:hidden;">
        <div style="height:100%; width:${pct}%; background:var(--red3);"></div>
      </div>
    </div>`;
  }).join('');
}

function addBoard() {
  const name = prompt("새 도장판 이름을 입력하세요 (비우면 자동 번호)");
  if(name === null) return;
  const newName = name.trim() || String(state.boards.length + 1);
  state.boards.push({ id: "b" + Date.now(), name: newName, initial: 0, active: true });
  saveState(); renderCoupons(); renderRecords();
}

// ============================================================
// 7. TAB 4: STATS 
// ============================================================
function renderStats() {
  let actorStatsHtml = `<tr><th style="text-align:left; color:var(--txt3);">배우</th><th style="color:var(--txt3);">배역</th><th style="color:var(--txt3);">관람</th></tr>`;
  CONFIG.ROLES.forEach((role, idx) => {
    const castKey = `cast${idx+1}`;
    role.actors.forEach(actor => {
      const cnt = state.records.filter(r => r[castKey] === actor).length;
      actorStatsHtml += `<tr>
        <td style="text-align:left; font-weight:600;">${actor}</td>
        <td style="font-size:10px; color:var(--txt4);">${role.label}</td>
        <td style="color:var(--red3); font-weight:700;">${cnt}</td>
      </tr>`;
    });
  });
  document.getElementById('stats-actors').innerHTML = actorStatsHtml;

  let seatMap = {};
  state.records.forEach(r => {
    if(r.seatZone && r.seatRow !== "" && r.seatNum !== "") {
      const k = `${r.seatZone}-${r.seatRow}-${r.seatNum}`;
      seatMap[k] = (seatMap[k] || 0) + 1;
    }
  });

  const getHeatClass = (cnt) => {
    if(cnt >= 5) return 'v5';
    if(cnt >= 4) return 'v4';
    if(cnt >= 3) return 'v3';
    if(cnt >= 2) return 'v2';
    if(cnt >= 1) return 'v1';
    return '';
  };

  const zones = [
    { name:'A', s:2, e:13, cols:()=>4 },
    { name:'B', s:0, e:13, cols:(r)=>r===0?12:13 },
    { name:'C', s:2, e:13, cols:()=>4 }
  ];

  let zHtml = { A:'', B:'', C:'' };
  for (let row = 0; row <= 13; row++) {
    zones.forEach(z => {
      if (row < z.s || row > z.e) {
        zHtml[z.name] += `<div class="seat-row"><div class="row-label"></div>`;
        const emptyCnt = z.name === 'B' ? (row === 0 ? 12 : 13) : 4;
        for (let i = 0; i < emptyCnt; i++) zHtml[z.name] += `<div class="seat-cell" style="visibility:hidden;"></div>`;
        zHtml[z.name] += `</div>`;
      } else {
        const colCnt = z.cols(row);
        const rowStyle = (z.name === 'B' && row === 0) ? ' style="margin-left:14px;"' : '';
        zHtml[z.name] += `<div class="seat-row"${rowStyle}><div class="row-label">${row}열</div>`;
        for (let col = 1; col <= colCnt; col++) {
          const k = `${z.name}-${row}-${col}`;
          const cnt = seatMap[k] || 0;
          zHtml[z.name] += `<div class="seat-cell ${getHeatClass(cnt)}" title="${z.name}구역 ${row}열 ${col}번: ${cnt}회"></div>`;
        }
        zHtml[z.name] += `</div>`;
      }
    });
  }

  let hmHtml = '';
  zones.forEach(z => {
    hmHtml += `<div class="zone-col"><div style="font-size:10px; font-weight:700; color:var(--txt3); margin-bottom:4px;">${z.name}구역</div>${zHtml[z.name]}</div>`;
  });
  document.getElementById('heatmap-container').innerHTML = hmHtml;
}

// ============================================================
// 8. TAB 5: SETTINGS & BACKUP
// ============================================================
async function fetchSchedule(manual = false) {
  const statusEl = document.getElementById('set-sch-time');
  if (statusEl) statusEl.textContent = '불러오는 중...';
  try {
    const res = await fetch('./schedule.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.schedule = data;
    saveState();
    const now = new Date().toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    if (statusEl) statusEl.textContent = now;
    if (manual) alert(`스케줄 ${data.length}개 업데이트 완료`);
    renderCalendar();
  } catch (e) {
    if (statusEl) statusEl.textContent = '캐시 사용 중 (오프라인)';
    if (manual) alert('오프라인 상태이거나 schedule.json 파일이 없습니다.');
  }
}

async function fetchEvents(manual = false) {
  const statusEl = document.getElementById('set-evt-time');
  if (statusEl) statusEl.textContent = '불러오는 중...';
  try {
    const res = await fetch('./events.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.events = data;
    saveState();
    const now = new Date().toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    if (statusEl) statusEl.textContent = now;
    if (manual) alert(`이벤트 ${data.length}개 업데이트 완료`);
    renderCalendar();
  } catch (e) {
    if (statusEl) statusEl.textContent = '캐시 사용 중 (오프라인)';
    if (manual) alert('오프라인 상태이거나 events.json 파일이 없습니다.');
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${CONFIG.SHOW_NAME}_백업_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(data.records && data.boards) {
        if(confirm("현재 데이터를 덮어쓰시겠습니까?")) {
          state = data; saveState(); location.reload();
        }
      } else { alert("올바른 백업 파일이 아닙니다."); }
    } catch(err) { alert("파일 읽기 오류"); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

  initRecordForm();
  initWalletForm();
  loadState();
  fetchSchedule(false);
  fetchEvents(false);
  switchTab('record', document.querySelector('.tab-btn')); 
};
